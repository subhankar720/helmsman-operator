name: Secret scan

# gitleaks over the FULL git history (default rules; reviewed findings listed by fingerprint in
# .gitleaksignore) and over the working tree (.gitleaks-tree.toml: shell-default credentials).
# Runs on every pull request directly, and on pushes to main via ci-image.yml (workflow_call).
# Needs no secrets; the image is pinned by digest (gitleaks v8.21.2, the version used locally).

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2

jobs:
  gitleaks:
    name: gitleaks (history and tree)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --verbose

      - name: Scan working tree
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            dir /repo --config /repo/.gitleaks-tree.toml --redact --no-banner --verbose
