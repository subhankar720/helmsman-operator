name: Lint

# Runs on pull requests directly, and on pushes to main via ci-image.yml
# (workflow_call). No push trigger: ci-image.yml already covers main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          # v1.64.8 is the last v1 release and is built with Go 1.24.
          version: v1.64.8
