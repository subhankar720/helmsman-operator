# Kind overlay: the locally built image loaded with `kind load docker-image`.
# helmsman-operator:dev only exists in the kind nodes' image store, so the
# container must never try to pull it: imagePullPolicy is set to Never here
# (declaratively; dev-up no longer patches it after applying).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../default
images:
- name: controller
  newName: helmsman-operator
  newTag: dev
patches:
- path: manager_pull_policy_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
