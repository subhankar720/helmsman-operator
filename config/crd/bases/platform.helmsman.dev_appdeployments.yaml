---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: appdeployments.platform.helmsman.dev
spec:
  group: platform.helmsman.dev
  names:
    kind: AppDeployment
    listKind: AppDeploymentList
    plural: appdeployments
    shortNames:
    - appdep
    singular: appdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.appName
      name: App
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.oidc.enabled
      name: OIDC
      type: boolean
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AppDeployment is the Schema for the appdeployments API.
          It is the typed, self-healing replacement for the golden-path Helm chart's
          app.platform.yaml values file. Each AppDeployment CR results in a complete
          platform-managed application deployment including StatefulSet, Services,
          NetworkPolicy, ServiceAccount, and optional OIDC registration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AppDeploymentSpec defines the desired state of AppDeployment.
              This is the developer-facing contract — the equivalent of spec.json in Webstax
              or app.platform.yaml in Helmsman's GitOps phase.
            properties:
              appName:
                description: |-
                  AppName is the unique identifier for this application.
                  Used as the name prefix for all created resources.
                minLength: 1
                type: string
              container:
                description: Container specifies the application container configuration.
                properties:
                  command:
                    description: Command overrides the image's default ENTRYPOINT.
                    items:
                      type: string
                    type: array
                  env:
                    additionalProperties:
                      type: string
                    description: Env is a map of environment variables to set in the
                      container.
                    type: object
                  port:
                    description: Port is the port the application listens on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - port
                type: object
              costCenterId:
                description: |-
                  CostCenterId maps to the organisation's cost allocation system.
                  Equivalent to eon_id in Webstax.
                type: string
              image:
                description: Image specifies the container image to deploy.
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    description: PullPolicy specifies when to pull the image.
                    type: string
                  repository:
                    description: Repository is the image repository (e.g. ghcr.io/org/app).
                    type: string
                  tag:
                    default: latest
                    description: Tag is the image tag to deploy.
                    type: string
                required:
                - repository
                - tag
                type: object
              oidc:
                description: |-
                  OIDC specifies the OpenID Connect configuration.
                  When enabled, an oauth2-proxy sidecar is injected and
                  a Keycloak client is registered automatically.
                properties:
                  enabled:
                    description: |-
                      Enabled determines whether OIDC authentication is enforced.
                      When true, an oauth2-proxy sidecar is injected and the Service
                      exposes the proxy port rather than the application port directly.
                    type: boolean
                type: object
              owningTeam:
                description: |-
                  OwningTeam is the team responsible for this application.
                  Used for governance labels and alerting.
                type: string
              replicas:
                default: 1
                description: Replicas is the desired number of pod replicas.
                format: int32
                type: integer
              resources:
                description: Resources specifies CPU and memory requests/limits.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
            required:
            - appName
            - container
            - image
            type: object
          status:
            description: AppDeploymentStatus defines the observed state of AppDeployment.
            properties:
              cluster:
                description: Cluster is the name of the cluster sourced from helmsman-platform-config.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the AppDeployment state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the internal service endpoint for this application.
                type: string
              namespace:
                description: Namespace is the Kubernetes namespace the application
                  was deployed into.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              oidcClientId:
                description: |-
                  OIDCClientID is the Keycloak client ID registered for this application.
                  Populated by the operator after successful Keycloak registration.
                type: string
              phase:
                description: 'Phase is a human-readable summary: Pending, Deploying,
                  Ready, Failed.'
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of pods in the Ready state.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
