---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: accessgrants.access.helmsman.dev
spec:
  group: access.helmsman.dev
  names:
    kind: AccessGrant
    listKind: AccessGrantList
    plural: accessgrants
    shortNames:
    - ag
    singular: accessgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.permission
      name: Permission
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.expiresAt
      name: ExpiresAt
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AccessGrant is the Schema for the accessgrants API.
          It represents a time-bound, approval-gated request for namespace-scoped
          access to a Kubernetes cluster. The controller creates a RoleBinding when
          the grant is approved and active, and deletes it when the TTL expires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AccessGrantSpec defines the desired access to be granted.
            properties:
              cluster:
                description: Cluster is the target cluster name (matches Argo CD cluster
                  registration name).
                minLength: 1
                type: string
              environment:
                default: dev
                description: |-
                  Environment indicates the target environment type.
                  Determines whether production approval gate is required.
                enum:
                - dev
                - staging
                - prod
                type: string
              namespace:
                description: Namespace is the target namespace on the cluster.
                minLength: 1
                type: string
              permission:
                default: ro
                description: 'Permission defines the access level: ro, rw, or admin.'
                enum:
                - ro
                - rw
                - admin
                type: string
              reason:
                description: |-
                  Reason is a human-readable justification for the access request.
                  Required for prod environment grants.
                type: string
              subject:
                description: |-
                  Subject is the user or service account receiving access.
                  Format: user:<email> or serviceaccount:<namespace>/<name>
                minLength: 1
                type: string
              ttl:
                default: 4h
                description: |-
                  TTL is the duration for which this grant is active.
                  Format: Go duration string e.g. "4h", "30m", "1h30m".
                minLength: 1
                type: string
            required:
            - cluster
            - namespace
            - permission
            - subject
            - ttl
            type: object
          status:
            description: AccessGrantStatus defines the observed state of an AccessGrant.
            properties:
              approvedAt:
                description: ApprovedAt is when the approval was granted.
                format: date-time
                type: string
              approvedBy:
                description: ApprovedBy is the identity that approved a PendingApproval
                  grant.
                type: string
              conditions:
                description: Conditions represent the latest observations of the AccessGrant
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: |-
                  ExpiresAt is the absolute time at which this grant expires.
                  Populated when the grant moves to Active state.
                format: date-time
                type: string
              message:
                description: Message provides human-readable context for the current
                  state.
                type: string
              roleBindingRef:
                description: RoleBindingRef is the name of the RoleBinding created
                  by this grant.
                type: string
              state:
                description: State is the current lifecycle state of the grant.
                enum:
                - Pending
                - PendingApproval
                - Active
                - Expired
                - Revoked
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
