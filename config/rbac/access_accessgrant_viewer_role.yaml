# This rule is not used by the project helmsman-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to access.helmsman.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: helmsman-operator
    app.kubernetes.io/managed-by: kustomize
  name: access-accessgrant-viewer-role
rules:
- apiGroups:
  - access.helmsman.dev
  resources:
  - accessgrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - access.helmsman.dev
  resources:
  - accessgrants/status
  verbs:
  - get
