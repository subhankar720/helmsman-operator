# This rule is not used by the project helmsman-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over platform.helmsman.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: helmsman-operator
    app.kubernetes.io/managed-by: kustomize
  name: appdeployment-admin-role
rules:
- apiGroups:
  - platform.helmsman.dev
  resources:
  - appdeployments
  verbs:
  - '*'
- apiGroups:
  - platform.helmsman.dev
  resources:
  - appdeployments/status
  verbs:
  - get
